{% extends "base.html" %}

{% block title %}Password Reset Complete | Smart School Hub{% endblock %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-50 via-white to-green-100 p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-200 p-8 text-center">

        <div class="mx-auto w-14 h-14 rounded-full bg-green-100 flex items-center justify-center mb-4">
            <span class="text-2xl">✓</span>
        </div>

        <h1 class="text-2xl font-bold text-gray-800">
            Password reset successful
        </h1>

        <p class="text-gray-500 text-sm mt-3">
            Your password has been successfully changed.
        </p>

        <a href="{% url 'accounts:login' %}"
            class="inline-block mt-6 bg-green-600 hover:bg-green-700 text-white px-6 py-2.5 rounded-lg font-semibold">
            Login
        </a>

    </div>

</div>

{% endblock %}
