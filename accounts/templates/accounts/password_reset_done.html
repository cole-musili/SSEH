{% extends "base.html" %}

{% block title %}Check Your Email | Smart School Hub{% endblock %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-50 via-white to-green-100 p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-200 p-8 text-center">

        <div class="mx-auto w-14 h-14 rounded-full bg-green-100 flex items-center justify-center mb-4">

            <span class="text-2xl">✓</span>

        </div>

        <h1 class="text-2xl font-bold text-gray-800">
            Check your email
        </h1>

        <p class="text-gray-500 text-sm mt-3 leading-relaxed">
            If an account exists with that email address,
            we've sent instructions for resetting your password.
        </p>

        <a href="{% url 'accounts:login' %}"
            class="inline-block mt-6 text-green-700 hover:underline text-sm font-medium">
            ← Back to Login
        </a>

    </div>

</div>

{% endblock %}
