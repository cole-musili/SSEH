{% extends "base.html" %}

{% block title %}Reset Password | Smart School Hub{% endblock %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-50 via-white to-green-100 p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-200 p-8">

        <div class="text-center mb-6">

            <div class="mx-auto w-14 h-14 rounded-full bg-green-100 flex items-center justify-center mb-4">

                <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-green-600" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 10-4 0v1h4V7z" />

                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M6 10h12a2 2 0 012 2v7a2 2 0 01-2 2H6a2 2 0 01-2-2v-7a2 2 0 012-2z" />
                </svg>

            </div>

            <h1 class="text-2xl font-bold text-gray-800">
                Forgot your password?
            </h1>

            <p class="text-gray-500 text-sm mt-2">
                Enter your email address and we'll send you a link to reset your password.
            </p>

        </div>


        <form method="post" class="space-y-5">

            {% csrf_token %}

            <div>

                <label for="id_email" class="block font-semibold text-gray-800 mb-1">
                    Email address
                </label>

                <input type="email" name="email" id="id_email" autocomplete="email" required
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none"
                    placeholder="Enter your email">

            </div>


            <button type="submit"
                class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg shadow transition">
                Send Reset Link
            </button>

        </form>


        <div class="text-center mt-6">

            <a href="{% url 'accounts:login' %}" class="text-green-700 hover:underline text-sm">
                ← Back to Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
