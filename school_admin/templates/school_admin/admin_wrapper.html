{% extends "base.html" %}
{% load static %}

{% block content %}
<!-- === Admin Layout Wrapper === -->
<div class="flex flex-col md:flex-row gap-6">
    <!-- === Sidebar (Admin Navigation) === -->
    <aside class="w-full md:w-64 bg-white border border-gray-200 rounded-lg shadow-sm p-4 md:sticky md:top-20 h-max">
        <h2 class="text-lg font-semibold text-green-700 mb-3">Admin Menu</h2>
        <ul class="space-y-2 text-sm">
            <!-- section: Dashboard -->
            <li>
                <a href="{% url 'school_admin:admin_dashboard' %}"
                    class="block px-2 py-1 rounded hover:bg-green-50 hover:text-green-700">
                    Dashboard
                </a>
            </li>

            <!-- section: Academic Years -->
            <li>
                <a href="{% url 'school_admin:academic_year_list' %}"
                    class="block px-2 py-1 rounded hover:bg-green-50 hover:text-green-700">
                    Academic Years
                </a>
            </li>

            <!-- section: Timetable -->
            <li>
                <a href="{% url 'school_admin:timetable_list' %}"
                    class="block px-2 py-1 rounded hover:bg-green-50 hover:text-green-700">
                    Timetables
                </a>
            </li>

            <!-- section: Teachers -->
            <li>
                <a href="{% url 'school_admin:teacher_record_list' %}"
                    class="block px-2 py-1 rounded hover:bg-green-50 hover:text-green-700">
                    Teachers
                </a>
            </li>

            <!-- section: Announcements -->
            <li>
                <a href="{% url 'announcements:list' %}"
                    class="block px-2 py-1 rounded hover:bg-green-50 hover:text-green-700">
                    Announcements
                </a>
            </li>
        </ul>
    </aside>

    <!-- === Main Admin Content === -->
    <main class="flex-1 bg-white border border-gray-200 rounded-lg shadow-sm p-6">
        {% block admin_content %}
        <!-- Individual page content loads here -->
        {% endblock %}
    </main>
</div>
{% endblock %}
