{% extends "base.html" %}
{% block title %}Create Teacher | Smart School Hub{% endblock %}

{% block content %}
<div class="container mx-auto p-6">
    <h1 class="text-3xl font-bold text-green-700 mb-6">➕ Create New Teacher</h1>

    <!-- Form Card -->
    <div class="bg-white shadow rounded-xl border border-gray-200 p-6 md:p-8 max-w-3xl mx-auto">
        <form method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-5">
            {% csrf_token %}

            <!-- Username -->
            <div>
                <label class="block text-gray-700 font-semibold mb-1">Username</label>
                <input type="text" name="username" required
                    class="w-full p-2.5 border rounded-md focus:ring-2 focus:ring-green-500 focus:outline-none"
                    placeholder="e.g. jdoe">
            </div>

            <!-- Email -->
            <div>
                <label class="block text-gray-700 font-semibold mb-1">Email (optional)</label>
                <input type="email" name="email"
                    class="w-full p-2.5 border rounded-md focus:ring-2 focus:ring-green-500 focus:outline-none"
                    placeholder="teacher@email.com">
            </div>

            <!-- Password -->
            <div>
                <label class="block text-gray-700 font-semibold mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full p-2.5 border rounded-md focus:ring-2 focus:ring-green-500 focus:outline-none"
                    placeholder="Enter password">
            </div>

            <!-- Phone -->
            <div>
                <label class="block text-gray-700 font-semibold mb-1">Phone</label>
                <input type="text" name="phone"
                    class="w-full p-2.5 border rounded-md focus:ring-2 focus:ring-green-500 focus:outline-none"
                    placeholder="e.g. +254712345678">
            </div>

            <!-- Specialization -->
            <div>
                <label class="block text-gray-700 font-semibold mb-1">Specialization</label>
                <select name="specialization"
                    class="w-full p-2.5 border rounded-md focus:ring-2 focus:ring-green-500 focus:outline-none">
                    <option value="" disabled selected>-- Select Subject --</option>
                    {% for subject in subjects %}
                    <option value="{{ subject.id }}">{{ subject.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Assigned Streams -->
            <div>
                <label class="block text-gray-700 font-semibold mb-1">Assigned Streams</label>
                <select name="streams" multiple
                    class="w-full p-2.5 border rounded-md focus:ring-2 focus:ring-green-500 focus:outline-none">
                    {% for stream in streams %}
                    <option value="{{ stream.id }}">{{ stream.grade.name }} {{ stream.code }}</option>
                    {% endfor %}
                </select>
                <p class="text-xs text-gray-500 mt-1">Hold <kbd>Ctrl</kbd> (or <kbd>Cmd</kbd>) to select multiple.</p>
            </div>

            <!-- Submit Button -->
            <div class="md:col-span-2 text-right mt-4">
                <button type="submit"
                    class="bg-green-600 hover:bg-green-700 text-white font-semibold px-6 py-2.5 rounded-lg shadow transition">
                    💾 Create Teacher
                </button>
            </div>
        </form>
    </div>

    <!-- Back Button -->
    <div class="text-center mt-6">
        <a href="{% url 'school_admin:teacher_records' %}"
            class="inline-flex items-center gap-2 text-green-700 hover:underline font-medium">
            ← Back to Teacher Records
        </a>
    </div>
</div>
{% endblock %}
