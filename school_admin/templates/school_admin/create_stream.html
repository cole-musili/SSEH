{% extends "base.html" %}
{% block title %}Create Stream{% endblock %}
{% block content %}
<div class="container mt-6">
    <h2 class="text-2xl font-bold mb-4 text-purple-700">Add Stream</h2>
    <form method="post" class="bg-gray-100 p-5 rounded shadow max-w-md">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="bg-purple-600 text-white px-4 py-2 rounded">Save</button>
    </form>
</div>
{% endblock %}
