{% extends "base.html" %}
{% block title %}Add Timetable Entry{% endblock %}
{% block content %}
<div class="container mx-auto p-6">
    <h1 class="text-2xl font-bold text-green-700 mb-4">➕ Add New Timetable Entry</h1>

    <form method="POST" class="bg-white shadow rounded p-6 space-y-4 border border-gray-200">
        {% csrf_token %}
        <div class="grid md:grid-cols-2 gap-4">
            <div>
                <label class="font-semibold text-gray-700">Teacher</label>
                <select name="teacher" class="w-full p-2 border rounded">
                    {% for t in teachers %}
                    <option value="{{ t.id }}">{{ t.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="font-semibold text-gray-700">Subject</label>
                <select name="subject" class="w-full p-2 border rounded">
                    {% for s in subjects %}
                    <option value="{{ s.id }}">{{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="font-semibold text-gray-700">Stream</label>
                <select name="stream" class="w-full p-2 border rounded">
                    {% for st in streams %}
                    <option value="{{ st.id }}">{{ st.grade.name }} {{ st.code }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="font-semibold text-gray-700">Day</label>
                <select name="day_of_week" class="w-full p-2 border rounded">
                    <option value="Mon">Monday</option>
                    <option value="Tue">Tuesday</option>
                    <option value="Wed">Wednesday</option>
                    <option value="Thu">Thursday</option>
                    <option value="Fri">Friday</option>
                    <option value="Sat">Saturday</option>
                </select>
            </div>
            <div>
                <label class="font-semibold text-gray-700">Start Time</label>
                <input type="time" name="start_time" class="w-full p-2 border rounded">
            </div>
            <div>
                <label class="font-semibold text-gray-700">End Time</label>
                <input type="time" name="end_time" class="w-full p-2 border rounded">
            </div>
        </div>

        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 mt-4">
            💾 Save Entry
        </button>
    </form>
</div>
{% endblock %}
