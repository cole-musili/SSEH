{% extends "base.html" %}
{% load static %}
{% block title %}Admin Profile Settings{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto bg-white shadow border border-gray-200 rounded-2xl p-6 mt-10">

    <h1 class="text-2xl font-bold text-green-700 mb-6 flex items-center gap-2">
        <i data-lucide="user-cog" class="w-6 h-6"></i>
        Admin Profile Settings
    </h1>

    <!-- Profile Update Form -->
    <form method="POST" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}
        <input type="hidden" name="update_profile" value="1">

        <!-- Profile Picture -->
        <div class="flex flex-col sm:flex-row items-center gap-4">
            <div class="relative">
                <img src="{% if profile.photo %}{{ profile.photo.url }}{% else %}{% static 'img/default-avatar.png' %}{% endif %}"
                    class="w-24 h-24 rounded-full border object-cover shadow-sm" alt="Profile">
            </div>
            <div class="flex flex-col w-full sm:w-auto">
                <label class="text-gray-700 text-sm font-medium">Change Photo</label>
                <input type="file" name="photo"
                    class="mt-2 text-sm border border-gray-300 rounded-lg px-3 py-1 w-full sm:w-64">
            </div>
        </div>

        <!-- Full Name -->
        <div>
            <label class="block text-gray-700 text-sm font-medium mb-1">Full Name</label>
            <input type="text" name="full_name" value="{{ profile.full_name }}"
                class="w-full border rounded-lg px-3 py-2 focus:ring-green-500 focus:border-green-500">
        </div>

        <!-- Status -->
        <div>
            <label class="block text-gray-700 text-sm font-medium mb-1">Status</label>
            <select name="status"
                class="w-full border rounded-lg px-3 py-2 focus:ring-green-500 focus:border-green-500">
                {% for value, label in profile.STATUS_CHOICES %}
                <option value="{{ value }}" {% if profile.status == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Phone -->
        <div>
            <label class="block text-gray-700 text-sm font-medium mb-1">Phone</label>
            <input type="text" name="phone" value="{{ profile.phone }}"
                class="w-full border rounded-lg px-3 py-2 focus:ring-green-500 focus:border-green-500">
        </div>

        <div class="flex justify-end">
            <button type="submit"
                class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg font-medium shadow transition">
                Save Changes
            </button>
        </div>
    </form>

    <!-- Password Section -->
    <div class="mt-10 border-t pt-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-4 flex items-center gap-2">
            <i data-lucide="lock" class="w-5 h-5"></i>
            Change Password
        </h2>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <input type="hidden" name="change_password" value="1">
            {{ form.as_p }}
            <button type="submit"
                class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium shadow transition">
                Update Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
