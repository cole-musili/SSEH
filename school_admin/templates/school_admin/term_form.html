{% extends "school_admin/base.html" %}
{% block content %}
<div class="container mt-6">
    <h1 class="text-2xl font-semibold text-blue-700 mb-4">{{ mode }} Term</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="bg-blue-700 text-white px-4 py-2 rounded">Save</button>
    </form>
</div>
{% endblock %}
