{% extends "base.html" %}
{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 sm:px-6 py-10">
    <div class="bg-white rounded-lg shadow border border-gray-200 p-6 text-center">
        <h2 class="text-2xl font-bold text-red-600 mb-4">Confirm Deletion</h2>
        <p class="text-gray-700 mb-6">
            Are you sure you want to delete <strong>"{{ resource.title }}"</strong>?
            This action cannot be undone.
        </p>

        <form method="POST" class="flex justify-center gap-3">
            {% csrf_token %}
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-lg shadow transition">
                Delete Permanently
            </button>
            <a href="{% url 'resources:resource_list' %}"
                class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-5 py-2 rounded-lg transition">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
