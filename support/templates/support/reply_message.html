{% extends "base.html" %}
{% block title %}Reply to Message{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10 bg-white p-6 rounded-lg shadow border border-gray-200">
    <h1 class="text-2xl font-bold text-green-700 mb-5">Reply to Message</h1>

    <div class="bg-gray-50 p-4 rounded border mb-5">
        <p><strong>From:</strong> {{ message.name }} ({{ message.email }})</p>
        <p><strong>Subject:</strong> {{ message.subject }}</p>
        <p class="mt-2 text-gray-700">{{ message.message }}</p>
    </div>

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-gray-700 font-medium mb-1">Your Reply</label>
            <textarea name="reply" rows="5"
                class="w-full border rounded p-2 focus:ring-2 focus:ring-green-500 focus:outline-none"
                placeholder="Type your reply message here..."></textarea>
        </div>

        <div class="flex justify-between">
            <a href="{% url 'support:admin_inbox' %}" class="text-gray-600 hover:underline">← Back to Inbox</a>
            <button type="submit"
                class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded shadow transition">Send
                Reply</button>
        </div>
    </form>
</div>
{% endblock %}
