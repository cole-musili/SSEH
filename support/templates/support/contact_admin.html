{% extends "base.html" %}
{% block title %}Contact Admin{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-10">
    <div class="bg-white p-8 rounded-xl shadow-md border border-gray-200 w-full max-w-md">
        <h1 class="text-2xl font-bold text-green-700 mb-6 text-center">Contact School Admin</h1>

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <!-- Full Name -->
            <div>
                <label for="id_name" class="block text-gray-700 font-medium mb-1">Your Name</label>
                {{ form.name }}
            </div>

            <!-- Email -->
            <div>
                <label for="id_email" class="block text-gray-700 font-medium mb-1">Email Address</label>
                {{ form.email }}
            </div>

            <!-- Subject -->
            <div>
                <label for="id_subject" class="block text-gray-700 font-medium mb-1">Subject</label>
                {{ form.subject }}
            </div>

            <!-- Message -->
            <div>
                <label for="id_message" class="block text-gray-700 font-medium mb-1">Message</label>
                {{ form.message }}
            </div>

            <!-- Submit -->
            <div>
                <button type="submit"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2.5 rounded-lg shadow transition">
                    Send Message
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
