{% extends "base.html" %}
{% block title %}Message Sent{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-green-50">
    <div class="bg-white p-8 rounded-xl shadow-md border border-green-200 max-w-md text-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-green-600 mx-auto mb-3" viewBox="0 0 24 24"
            fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12l2 2l4 -4m6 2a9 9 0 11-18 0a9 9 0 0118 0z" />
        </svg>
        <h2 class="text-xl font-bold text-green-700 mb-2">Message Sent Successfully</h2>
        <p class="text-gray-600 mb-5">Thank you for contacting the school admin. We’ll get back to you soon.</p>
        <a href="{% url 'accounts:login' %}" class="text-green-700 hover:underline">Back to Login</a>
    </div>
</div>
{% endblock %}
